# Low-memory overrides for 4GB VPS (Mikrus 3.5)
# Apply on top of prod:
#   docker compose -f docker-compose.yaml \
#                  -f docker-compose.prod.yaml \
#                  -f docker-compose.mikrus35.yaml up -d

services:

  tailscale:
    deploy:
      resources:
        limits:
          memory: 128M

  immichframe:
    deploy:
      resources:
        limits:
          memory: 128M

  immich-machine-learning:
    environment:
      MACHINE_LEARNING_FACIAL_RECOGNITION_MODEL: buffalo_s   # ~half the RAM of buffalo_l
    deploy:
      resources:
        limits:
          memory: 1G

  postgres:
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    deploy:
      resources:
        limits:
          memory: 128M

  immich-server:
    deploy:
      resources:
        limits:
          memory: 1536M

  evolution-api:
    deploy:
      resources:
        limits:
          memory: 256M

  photos_to_frame_daemon:
    deploy:
      resources:
        limits:
          memory: 128M
