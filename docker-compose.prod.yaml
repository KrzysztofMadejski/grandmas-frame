# Production overrides — apply with:
#   docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d

services:
  immich-machine-learning:
    deploy:
      resources:
        limits:
          memory: 4G   # ML model loading can spike; tune to your server's RAM

  postgres:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  immich-server:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  evolution-api:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  photos_to_frame_daemon:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
